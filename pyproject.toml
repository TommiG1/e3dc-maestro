# Tooling config for CI / local tests.
# Integration version: custom_components/e3dc_maestro/manifest.json (single source of truth).

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["custom_components", "tests"]

[tool.ruff.lint]
# Correctness-first gate for CI. Unused-import cleanup is incremental.
select = ["E9", "F63", "F7", "F82"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["custom_components/e3dc_maestro"]
omit = [
  "custom_components/e3dc_maestro/config_flow.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 30
