name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov ruff pyyaml
      - name: Ruff check
        run: ruff check custom_components tests
      - name: Validate dashboards
        run: |
          python scripts/validate_dashboards.py --strict-shared
          python scripts/sync_dashboard_strategy.py --check
      - name: Unit tests with coverage
        run: |
          pytest --cov=custom_components.e3dc_maestro --cov-report=term-missing

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel-src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel-src/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Committed panel bundle matches source
        run: git diff --exit-code -- ../custom_components/e3dc_maestro/frontend/panel
      - name: No stale panel chunks
        run: test -z "$(git status --porcelain -- ../custom_components/e3dc_maestro/frontend/panel)"

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master
